# pre-commit (https://pre-commit.com) - the local half of the quality gate.
#
#   pip install pre-commit && pre-commit install
#   pre-commit run --all-files
#
# Scope note: only Python-only hooks are remote. actionlint and gitleaks are NOT pulled as
# pre-commit mirrors, on purpose:
#
#   * their mirrors compile a Go binary from source, which needs proxy.golang.org. That host is
#     unreachable on some networks, and a hook that fails to install is worse than no hook.
#   * both already have dedicated CI jobs in .github/workflows/validate.yml running the official
#     actions against the same revisions.
#
# Install them as local binaries to get them on the commit path too:
#   winget install rhysd.actionlint Gitleaks.Gitleaks
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key
      - id: requirements-txt-fixer

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.7
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^app/.*\.py$
      - id: ruff-format
        files: ^app/.*\.py$

  # These two shell out to binaries on PATH (language: system), so an absent binary is reported
  # as "not found" instead of triggering a source build.
  - repo: local
    hooks:
      - id: actionlint-local
        name: actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false
      - id: gitleaks-local
        name: gitleaks
        entry: gitleaks protect --staged --config .gitleaks.toml --no-banner --redact
        language: system
        pass_filenames: false
