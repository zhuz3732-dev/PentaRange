# pre-commit (https://pre-commit.com) - the local half of the quality gate.
#
#   pip install pre-commit && pre-commit install
#   pre-commit run --all-files
#
# Scope: this config holds ONLY the pure-Python hooks, so `pre-commit run --all-files` behaves
# identically on a laptop and on a CI runner. Anything that needs an external binary is
# deliberately excluded:
#
#   actionlint  -> job `actionlint` in .github/workflows/validate.yml
#   gitleaks    -> job `gitleaks`   in .github/workflows/validate.yml
#
# Both were briefly wired in here as two different things - first as pre-commit mirrors (which
# compile a Go binary from source and need proxy.golang.org), then as `language: system` hooks.
# The mirrors fail to install on networks without access to the Go proxy; the system hooks fail on
# CI runners that do not have the binary. A gate that only works on one machine is not a gate.
#
# Run them by hand if you want them before a commit:
#   winget install rhysd.actionlint Gitleaks.Gitleaks
#   actionlint && gitleaks protect --staged --config .gitleaks.toml
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key
      - id: requirements-txt-fixer

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.7
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^app/.*\.py$
      - id: ruff-format
        files: ^app/.*\.py$
