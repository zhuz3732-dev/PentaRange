name: CI

on:
  push:
    branches: [main, hardened]
  pull_request:
    branches: [main, hardened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Compile every module
        run: |
          python -m compileall -q app
          echo "compileall OK"

  compose-config:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: docker compose config --quiet

  port-guard:
    name: Ports must stay on loopback
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject any 0.0.0.0 port binding
        run: |
          if grep -nE '^\s*-\s*"?0\.0\.0\.0:' docker-compose.yml; then
            echo "::error::docker-compose.yml publishes a port on 0.0.0.0. This lab must never be reachable off-host."
            exit 1
          fi
          echo "all published ports are loopback-scoped"

  build:
    name: Build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build web
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: false
          tags: pentarange-web:ci
      - name: Build webshell
        uses: docker/build-push-action@v7
        with:
          context: ./webshell
          push: false
          tags: pentarange-webshell:ci
